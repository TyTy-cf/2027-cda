services:
  fix-permissions:
    image: node:24
    user: root
    volumes:
      - node_modules:/home/node/app/node_modules
    command: chown -R node:node /home/node/app/node_modules

  node:
    image: node:24
    working_dir: /home/node/app
    user: node
    depends_on:
      - fix-permissions
    volumes:
      - ./:/home/node/app
      - node_modules:/home/node/app/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules: